name: 🐍 Update contribution snake

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    paths:
      - .github/workflows/snake.yml
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🐍 Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-light&color_snake=#7aa2f7
            profile/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#1a1b26,#2e3c64,#3d59a1,#7aa2f7,#bb9af7

      - name: 💾 Commit snake
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          base64 -w0 profile/snake.svg > "$RUNNER_TEMP/light.b64"
          base64 -w0 profile/snake-dark.svg > "$RUNNER_TEMP/dark.b64"
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --rawfile query .github/api/createCommitOnBranch.gql \
            --rawfile light "$RUNNER_TEMP/light.b64" \
            --rawfile dark "$RUNNER_TEMP/dark.b64" \
            '{query: $query, variables: {
              githubRepository: $repo,
              branchName: $branch,
              expectedHeadOid: $head,
              commitMessage: "docs: update contribution snake",
              files: [
                {path: "profile/snake.svg", contents: $light},
                {path: "profile/snake-dark.svg", contents: $dark}
              ]}}' > "$RUNNER_TEMP/body.json"
          gh api graphql --input "$RUNNER_TEMP/body.json"
